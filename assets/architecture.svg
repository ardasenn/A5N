<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eef2f7; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
    .layer { fill: #e6f4f1; stroke: #0f766e; stroke-width: 1.4; }
    .store { fill: #fdf6e3; stroke: #b45309; stroke-width: 1.2; }
    .t  { fill: #1e293b; font-size: 13px; }
    .tb { fill: #1e293b; font-size: 13.5px; font-weight: 600; }
    .tl { fill: #0f766e; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .ts { fill: #475569; font-size: 11.5px; }
    .edge { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    .loop { stroke: #b45309; stroke-width: 1.3; fill: none; marker-end: url(#arr); stroke-dasharray: 4 3; }
  </style>

  <!-- sources -->
  <rect class="box" x="80" y="16" width="280" height="46" rx="8"/>
  <text class="tb" x="220" y="35" text-anchor="middle">~/.claude/projects</text>
  <text class="ts" x="220" y="52" text-anchor="middle">Claude Code transcripts, matched by folder</text>

  <rect class="box" x="420" y="16" width="280" height="46" rx="8"/>
  <text class="tb" x="560" y="35" text-anchor="middle">~/.codex/sessions</text>
  <text class="ts" x="560" y="52" text-anchor="middle">Codex transcripts, matched by session cwd</text>

  <path class="edge" d="M 220 62 L 220 88 L 385 88 L 385 104"/>
  <path class="edge" d="M 560 62 L 560 88 L 395 88 L 395 104"/>

  <!-- layer 1 -->
  <rect class="layer" x="130" y="106" width="520" height="72" rx="8"/>
  <text class="tl" x="150" y="126">LAYER 1 · CAPTURE — PURE PYTHON, NO MODEL</text>
  <text class="t" x="150" y="146">discover → filter (watermark · freshness · size) → dedup by content</text>
  <text class="ts" x="150" y="164">every drop writes a deterministic skip line to the project log</text>

  <path class="edge" d="M 390 178 L 390 200"/>

  <!-- raw store -->
  <rect class="store" x="180" y="202" width="420" height="46" rx="8"/>
  <text class="tb" x="390" y="221" text-anchor="middle">raw/sessions/*.jsonl</text>
  <text class="ts" x="390" y="238" text-anchor="middle">permanent filtered copies, committed — the vault keeps its own</text>

  <path class="edge" d="M 390 248 L 390 270"/>

  <!-- layer 2 -->
  <rect class="layer" x="130" y="272" width="520" height="72" rx="8"/>
  <text class="tl" x="150" y="292">LAYER 2 · ONE HEADLESS WORKER PER SESSION — claude | codex</text>
  <text class="t" x="150" y="312">reads the transcript (condensed to a skeleton when huge)</text>
  <text class="ts" x="150" y="330">writes linked pages, nothing else — no discovery, no commits, no subagents</text>

  <path class="edge" d="M 390 344 L 390 366"/>

  <!-- pages -->
  <rect class="box" x="150" y="368" width="480" height="46" rx="8"/>
  <text class="tb" x="390" y="387" text-anchor="middle">sources · entities · concepts · decisions · bugs · patterns</text>
  <text class="ts" x="390" y="404" text-anchor="middle">one linked markdown wiki per project, plus cross-project patterns</text>

  <path class="edge" d="M 390 414 L 390 436"/>

  <!-- verify -->
  <rect class="layer" x="130" y="438" width="520" height="64" rx="8"/>
  <text class="tl" x="150" y="458">VERIFY — THE ARTIFACT, NEVER A CLAIM</text>
  <text class="t" x="150" y="478">schema paths · id trace · frontmatter — pass ⇒ that unit commits immediately</text>
  <text class="ts" x="150" y="495">the worker's own words are never trusted</text>

  <!-- retry loop -->
  <path class="loop" d="M 650 470 C 756 470 756 300 655 300"/>
  <text class="ts" x="697" y="376" text-anchor="middle">fail ⇒ roll back</text>
  <text class="ts" x="697" y="391" text-anchor="middle">that unit only,</text>
  <text class="ts" x="697" y="406" text-anchor="middle">retry tomorrow</text>

  <!-- bottom band -->
  <path class="edge" d="M 390 502 L 390 524"/>
  <rect class="box" x="36" y="526" width="220" height="64" rx="8"/>
  <text class="tb" x="146" y="549" text-anchor="middle">weekly lint</text>
  <text class="ts" x="146" y="566" text-anchor="middle">contradictions · dead links · drift</text>
  <text class="ts" x="146" y="581" text-anchor="middle">report only, one worker per project</text>

  <rect class="box" x="280" y="526" width="220" height="64" rx="8"/>
  <text class="tb" x="390" y="549" text-anchor="middle">monthly digest</text>
  <text class="ts" x="390" y="566" text-anchor="middle">what accumulated, from git history</text>
  <text class="ts" x="390" y="581" text-anchor="middle">deterministic, no model, notifies you</text>

  <rect class="box" x="524" y="526" width="220" height="64" rx="8"/>
  <text class="tb" x="634" y="549" text-anchor="middle">MCP server</text>
  <text class="ts" x="634" y="566" text-anchor="middle">overview · search · page, read only</text>
  <text class="ts" x="634" y="581" text-anchor="middle">any agent consults the vault</text>

  <text class="ts" x="390" y="632" text-anchor="middle">orchestration is deterministic script — the model only works at the leaf, and success is measured by the artifact</text>
</svg>
