# A5N configuration. Copy to config.ini and edit.
#
#     cp config.example.ini config.ini
#
# Every path may use ~ for your home directory.
# Nothing runs until config.ini exists.

[vault]
# Where your knowledge vault lives. Created by scripts/setup.sh if missing.
# Keep it outside this repository: the repo is the tool, the vault is your data.
path = ~/knowledge-vault

# Language for vault pages. Any language name the model understands.
# The prompts stay in English; this value tells the agent what to write in.
language = English

# Name shown in the vault index page.
title = Knowledge Vault

[agents]
# Transcript sources. Leave a value empty to skip that agent entirely.
claude_projects = ~/.claude/projects
codex_sessions = ~/.codex/sessions

# Headless agent used to run ingest and lint. "auto" searches PATH.
claude_bin = auto

# Model passed to the headless runs.
model = claude-sonnet-5

[schedule]
# Local times for the scheduled jobs. Applied by scripts/setup.sh.
# Set enabled = no if you prefer to run everything by hand.
enabled = yes
ingest = 09:07
lint = sun 11:07

[limits]
# Sessions smaller than this are logged as skipped instead of summarized.
min_session_kb = 50

# A session touched within this many hours may still be running, so it waits
# for the next run.
settle_hours = 2

# Wall clock ceiling for one headless run, in seconds. Not a work limit,
# only a guard so a stuck run cannot hang forever.
run_timeout = 7000

# One section per project. The part after "project:" becomes the namespace
# folder name inside your vault.
[project:acme-shop]
# Where the code lives. Recorded in the namespace index for orientation.
repo = ~/work/acme-shop

# Substring used to find this project's transcripts. Matched against the
# Claude Code project folder name and against the Codex session cwd, so a
# single value usually covers both. Worktrees match automatically because
# their paths contain the same substring.
match = acme-shop

# Sessions older than this date are ignored. Set it to your setup date to
# start clean, or to an older date to pull in history.
watermark = 2026-01-01
